<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Joseph Fleming">
    <meta name="description" content="Contact Strength Training and Conditioning">
    <title>Contact Us | Strength Training</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="style.css">       
    <script>
    document.documentElement.hidden = true;
    </script>
    <script type="module" src="JS/auth-guard.js"></script>

    
</head>

<body>

    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="site-logo">Strength Training and Conditioning</a>
        </div>

        <nav class="navbar">
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="exercise-explorer.html">Exercise Explorer</a>
                <a href="training-information.html">Training Information</a>
                <a href="contact.html">Contact Us</a>
                <a href="account.html">Account</a>
            </div>
        </nav>
    </header>

    <main>

        <section class="section">

            <h1 class="section-heading">Contact Us</h1>

            <form class="contact-form">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6"></textarea>

                <button type="submit" class="button">Submit</button>

            </form>
            <p id="contact-status" role="status" aria-live="polite"></p>

        </section>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Joseph Fleming</p>
    </footer>
<script type="module" src="JS/contact.js"></script>
</body>
</html>
